<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Шёпот — нет соединения</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0b0d12; color: #e9edf4;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .logo { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #5b7cfa, #8b6dff); display: grid; place-items: center; margin-bottom: 20px; }
    .logo svg { width: 40px; height: 40px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #8b93a4; margin: 0 0 20px; max-width: 320px; }
    button {
      height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
      background: #5b7cfa; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5c0 4.14-4.03 7.5-9 7.5-1.02 0-2-.14-2.91-.4L4 20l1.35-3.6C3.9 15.05 3 13.36 3 11.5 3 7.36 7.03 4 12 4s9 3.36 9 7.5z"/>
      <path d="M8 10h6"/><path d="M10 13.5h4"/>
    </svg>
  </div>
  <h1>Нет соединения</h1>
  <p>Шёпот — онлайн-чат, поэтому без интернета собеседников не найти. Проверьте связь и попробуйте снова.</p>
  <button onclick="location.reload()">Обновить</button>
</body>
</html>
